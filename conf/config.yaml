# Main Hydra config: composes one option from each config group.
# Override any group or value from the CLI, e.g.:
#   python train.py model=u-net loss=ssim trainer.max_epochs=100 model.net.latent_dim=64
#   python train.py -m            # sweeps the 8 runs defined in hydra.sweeper.params
defaults:
  - data: mvtec
  - model: vae
  - loss: l1
  - trainer: default
  - logger: wandb
  - _self_

seed: 42
run_name: ${model.name}-${loss.name}

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${run_name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${run_name}
  sweeper:
    params:                       # only used with -m (multirun): 2 models x 4 losses
      model: vae,u-net
      loss: l1,l2,ssim,ssim_l1
