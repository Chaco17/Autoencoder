name: u-net
beta: 0.0            # no KL term for the U-Net

net:
  _target_: src.models.unet.UNet
  in_channels: 3
  img_size: ${data.img_size}
  latent_dim: 128    # channels of the bottleneck (z = pooled bottleneck)
  base_channels: 32

optimizer:
  _target_: torch.optim.Adam
  _partial_: true    # params are passed later in configure_optimizers()
  lr: 1.0e-3
  weight_decay: 0.0
